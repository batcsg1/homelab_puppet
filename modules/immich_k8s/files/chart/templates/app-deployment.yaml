apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    io.kompose.service: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      labels:
        io.kompose.service: app
    spec:
      enableServiceLinks: false
      {{- if .Values.gpu.transcoding }}
      runtimeClassName: nvidia-container-runtime
      {{- end }}
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:{{ .Values.immichVersion }}
          envFrom:
            - configMapRef:
                name: env
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            {{- if .Values.gpu.transcoding }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility
            {{- end }}
          ports:
            - containerPort: 2283
          {{- if .Values.gpu.transcoding }}
          resources:
            limits:
              nvidia.com/gpu: 1
          {{- end }}
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: storage
              mountPath: /mnt/media/samuel
              subPath: {{ .Values.libraries.samuel }}
            - name: storage
              mountPath: /mnt/media/carmen
              subPath: {{ .Values.libraries.carmen }}
      volumes:
        - name: storage
          nfs:
            server: {{ .Values.nfs.server }}
            path: {{ .Values.nfs.path }}